# ORBIS — one-command deploy
#
#   docker compose up -d
#
# Default services:
#   - orbis        WebRTC UI + Whisper + Kokoro + routing vLLM
#
# Fish S2-Pro TTS is opt-in via the `fish` profile:
#
#   TTS_BACKEND=fish docker compose --profile fish up
#
# Requires ~/dev/fish-speech checked out at ../fish-speech as the
# build context; use this only if you want cloneable voices and have
# the GPU capacity. Default (kokoro) needs no sidecar.

services:
  # Opt-in Fish TTS sidecar — activate with `--profile fish`.
  # Build context points at a sibling fish-speech checkout that already
  # has .venv + checkpoints/s2-pro/ present.
  fish-speech:
    profiles: [fish]
    build:
      context: ../fish-speech
      dockerfile: ${PWD}/Dockerfile.fish
    container_name: orbis-fish
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "${FISH_PORT:-8092}:8092"
    volumes:
      - ${FISH_REFERENCES_DIR:-/mnt/data/fish-references}:/app/references
    environment:
      - NVIDIA_VISIBLE_DEVICES=${FISH_GPU:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${FISH_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

  orbis:
    build: .
    container_name: orbis
    restart: unless-stopped
    ports:
      - "${PORT:-7866}:7866"
    volumes:
      - ${HF_HOME:-/mnt/models/huggingface}:/models
    env_file:
      - path: .env
        required: false
    environment:
      - HF_HOME=/models
      - PORT=7866
      - VLLM_PORT=8100
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen3.5-4B}
      - WHISPER_MODEL=${WHISPER_MODEL:-openai/whisper-large-v3-turbo}
      - TTS_BACKEND=${TTS_BACKEND:-kokoro}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      # Fish is opt-in — only used when TTS_BACKEND=fish. The fish
      # service above runs under the `fish` compose profile.
      - FISH_URL=${FISH_URL:-http://fish-speech:8092}
      - FISH_REFERENCE_ID=${FISH_REFERENCE_ID:-}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT:-}
      - START_VLLM=${START_VLLM:-1}
      - LLM_URL=${LLM_URL:-}

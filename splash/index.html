<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORBIS</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
                     Arial, sans-serif;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .stack { display: grid; gap: 1.5rem; }
      h1 {
        margin: 0;
        font-weight: 300;
        letter-spacing: 0.3em;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      .orb {
        width: 96px;
        height: 96px;
        justify-self: center;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%,
          rgba(245, 158, 11, 0.55) 0%,
          rgba(244, 63, 94, 0.25) 45%,
          transparent 70%);
        animation: breathe 2.4s ease-in-out infinite;
        filter: blur(0.5px);
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.95); opacity: 0.7; }
        50%      { transform: scale(1.05); opacity: 1.0; }
      }
      .status {
        font-size: 0.8125rem;
        color: #71717a;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="stack">
        <div class="orb" aria-hidden="true"></div>
        <h1>ORBIS</h1>
        <div class="status" role="status" aria-live="polite">Starting up…</div>
      </div>
    </div>
    <script>
      const status = document.querySelector('.status');
      const phases = [
        'Starting up…',
        'Checking microphone access…',
        'Preparing native audio…',
        'Starting the local companion…',
      ];
      let i = 0;
      setInterval(() => {
        i = (i + 1) % phases.length;
        status.textContent = phases[i];
      }, 3500);
    </script>
  </body>
</html>

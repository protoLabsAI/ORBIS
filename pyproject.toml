[project]
name = "orbis"
version = "0.2.47"
description = "ORBIS — voice-first AI companion. Pipecat voice pipeline + orb visualization + delegate-to-your-agents routing."
requires-python = ">=3.11"
dependencies = [
    # Pipecat + transports
    "pipecat-ai[silero,openai]>=1.0",
    # Local model runtimes — used by Whisper STT + Kokoro TTS. Heavy
    # but baseline; users who only want cloud STT/TTS can skip by
    # installing a slim variant (future work).
    "torch>=2.5",
    "transformers>=4.46",
    "accelerate",
    "kokoro>=0.9",
    # Web + I/O
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "httpx",
    "soundfile",
    "soxr",
    "numpy",
    "pyyaml",
    # Observability
    "langfuse>=4,<5",
    # MLX-LM for native Apple Silicon LLM inference (Mac arm64 only).
    # Added so the desktop sidecar can run the LLM in-process via
    # Apple's MLX framework instead of requiring a separate Ollama
    # install. Conditional dep — pip will skip on Linux/Windows
    # (where the Docker self-host path is the supported answer per
    # README). See voice/llm/mlx.py + voice/llm/__init__.py for the
    # adapter + factory routing.
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Heavy / opt-in audio quality extras. Install only when the matching
# env (NOISE_FILTER, SMART_TURN) is enabled.
rnnoise = ["pipecat-ai[rnnoise]"]
smart-turn = ["pipecat-ai[local-smart-turn]"]
# Speaker verification — speechbrain ECAPA-TDNN for the speaker_gate
# Phase 1 perception layer (#35). Install when enrolling a voiceprint;
# without enrollment the gate stays in owner-trust passthrough.
speaker-id = ["speechbrain>=1.0", "torchaudio"]
# SenseVoice STT — FunAudioLLM/SenseVoiceSmall via funasr. Set
# STT_BACKEND=sensevoice to enable; without this extra installed,
# STT_BACKEND=local (Whisper) and STT_BACKEND=openai still work.
# 234 M params, ~70 ms on Blackwell, low-hundreds-ms on CPU. Provides
# STT + 7-class emotion + audio events in one forward pass per #66.
sensevoice = ["funasr>=1.2"]
# Parakeet STT — NVIDIA Parakeet-TDT via Apple MLX. Set
# STT_BACKEND=parakeet to enable; faster + far fewer silence
# hallucinations than Whisper. Apple Silicon only (MLX). Without this
# extra, STT_BACKEND=local (Whisper) and =openai still work.
parakeet = ["parakeet-mlx>=0.5"]
audio = ["pipecat-ai[rnnoise,local-smart-turn]"]
# Test-only: respx mocks httpx for LLM/delegate probe tests; pytest-asyncio
# runs native Unix-socket transport, STT, and config endpoint tests on a
# fresh CI install without relying on transitive dev-machine packages.
test = ["pytest", "pytest-asyncio", "respx"]
# Lint — ruff catches F821 (undefined names), F401 (unused imports),
# F841 (unused locals), and the rest of the pyflakes-equivalent F-set.
# Wired into CI on every PR — see .github/workflows/lint.yml. The
# regression that triggered this gate: PR #44 deleted the
# `skill_llm` local but left one orphan reference, and every
# voice-session start 500'd in production until #88 caught it.
lint = ["ruff>=0.5"]

[project.scripts]
orbis = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "a2a", "agent", "auth", "memory", "voice", "static"]

# `web/dist/` is gitignored (standard Vite output) but the desktop
# build runs `bun run build` before packing; force-include tells
# hatchling to bundle it anyway. Applies to both sdist and wheel so
# the PyApp-extracted site-packages/ contains the SPA that app.py
# serves at `Path(__file__).parent / "web" / "dist"`.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "web/dist"

[tool.hatch.build.targets.sdist]
include = ["app.py", "a2a", "agent", "auth", "memory", "voice", "static", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pipecat imports audioop — flagged by Python 3.13 but we're on 3.12.
    "ignore::DeprecationWarning:pipecat",
]

[tool.ruff]
# Match the project's minimum supported Python so the linter doesn't
# flag features that are valid here.
target-version = "py311"
extend-exclude = [
    ".venv",
    "dist-sdist",
    "web/dist",
    "splash",
    "src-tauri/target",
]

[tool.ruff.lint]
# Pyflakes ("F") only for now — the goal is to catch undefined-name
# regressions like the PR #44 `skill_llm` orphan. Adding pycodestyle
# (E/W) would be noisy on the existing tree without an autofix pass;
# we can opt in incrementally later.
select = ["F"]

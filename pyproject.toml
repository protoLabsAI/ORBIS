[project]
name = "orbis"
version = "0.1.14"
description = "ORBIS — voice-first AI companion. Pipecat voice pipeline + orb visualization + delegate-to-your-agents routing."
requires-python = ">=3.11"
dependencies = [
    # Pipecat + transports
    "pipecat-ai[webrtc,silero,openai]>=1.0",
    # Local model runtimes — used by Whisper STT + Kokoro TTS. Heavy
    # but baseline; users who only want cloud STT/TTS can skip by
    # installing a slim variant (future work).
    "torch>=2.5",
    "transformers>=4.46",
    "accelerate",
    "kokoro>=0.9",
    # Web + I/O
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "httpx",
    "soundfile",
    "soxr",
    "numpy",
    "pyyaml",
    # Observability
    "langfuse>=4,<5",
    # MLX-LM for native Apple Silicon LLM inference (Mac arm64 only).
    # Added so the desktop sidecar can run the LLM in-process via
    # Apple's MLX framework instead of requiring a separate Ollama
    # install. Conditional dep — pip will skip on Linux/Windows
    # (where the Docker self-host path is the supported answer per
    # README). See voice/llm/mlx.py + voice/llm/__init__.py for the
    # adapter + factory routing.
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Heavy / opt-in audio quality extras. Install only when the matching
# env (NOISE_FILTER, SMART_TURN) is enabled.
rnnoise = ["pipecat-ai[rnnoise]"]
smart-turn = ["pipecat-ai[local-smart-turn]"]
audio = ["pipecat-ai[rnnoise,local-smart-turn]"]
# Test-only: respx mocks httpx for the LLM-probe tests.
test = ["pytest", "respx"]

[project.scripts]
orbis = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "a2a", "agent", "auth", "memory", "voice", "static"]

# `web/dist/` is gitignored (standard Vite output) but the desktop
# build runs `bun run build` before packing; force-include tells
# hatchling to bundle it anyway. Applies to both sdist and wheel so
# the PyApp-extracted site-packages/ contains the SPA that app.py
# serves at `Path(__file__).parent / "web" / "dist"`.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "web/dist"

[tool.hatch.build.targets.sdist]
include = ["app.py", "a2a", "agent", "auth", "memory", "voice", "static", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pipecat imports audioop — flagged by Python 3.13 but we're on 3.12.
    "ignore::DeprecationWarning:pipecat",
]

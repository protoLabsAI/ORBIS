# Delegate registry — consumed by agent/delegates.py.
#
# The agent's `delegate_to(target, query)` tool picks one of these by
# name. Each delegate has a `description` the LLM uses to decide which
# target fits a question.
#
# Three `type`s supported:
#   a2a    — JSON-RPC `message/send` to another agent (the A2A protocol)
#   openai — chat-completions to any OpenAI-compatible /v1 endpoint
#   acp    — a local coding agent ORBIS launches + drives over the Agent
#            Client Protocol (protoCLI, OpenCode, Claude Code, Codex). Needs
#            `command` + `args` (how to start it in ACP mode) and `workdir`
#            (the directory it's responsible for — its session cwd + sandbox).
#
# No delegates ship by default — add your own here, or from
# Settings → Agent → Delegates. Empty list = `delegate_to` is not
# registered. See docs/reference/agent.md.

delegates:
  - name: hub
    type: a2a
    description: >
      Multi-step reasoning, tool use, fleet delegation, background work,
      and long-horizon tasks. Use for: complex goals requiring multiple
      tools, tasks that should run in the background, research, anything
      that spans multiple turns.
    url: http://127.0.0.1:7871/a2a

# ─── Examples (uncomment + edit) ────────────────────────────────────────
#
# An A2A agent in a fleet:
#
#   - name: helm
#     description: >-
#       Chief of staff — project status (sitreps), coordination across
#       agents, planning, and bug triage. Use for anything needing a wider
#       look across the board, CI, and incidents.
#     type: a2a
#     url: https://agent.example.com/a2a
#     auth: { scheme: apiKey, credentialsEnv: AGENT_API_KEY }
#
# A heavy reasoning model through an OpenAI-compatible gateway:
#
#   - name: opus
#     description: >-
#       Heavy reasoning model. Use for analysis, summarization, or a
#       thorough explanation of a topic.
#     type: openai
#     url: http://gateway:4000/v1
#     model: claude-opus-4-6
#     api_key_env: LITELLM_MASTER_KEY
#     system_prompt: >-
#       You are a research assistant. Answer thoroughly but concisely.
#
# An ACP coding agent you voice-drive (proto first-class; opencode / claude
# code / codex are the same shape — point `workdir` at the repo it owns):
#
#   - name: proto
#     description: >-
#       My terminal coding agent for the ORBIS repo. Use to read, edit, or
#       run code in that project — "ask proto to add a test", "fix the build".
#     type: acp
#     command: proto
#     args: ["--acp"]
#     workdir: ~/dev/ORBIS
#
#   - name: opencode
#     description: Coding agent for the marketing repo.
#     type: acp
#     command: opencode
#     args: ["acp"]
#     workdir: ~/dev/ORBIS/sites/marketing
#
#   - name: claude-code
#     description: Claude Code, for deep refactors in the ORBIS repo.
#     type: acp
#     command: npx
#     args: ["@zed-industries/claude-code-acp"]
#     workdir: ~/dev/ORBIS
#
#   - name: codex
#     description: OpenAI Codex, for the ORBIS repo.
#     type: acp
#     command: codex-acp        # the zed-industries/codex-acp bridge binary
#     args: []
#     workdir: ~/dev/ORBIS
#
# Launch commands per agent (each speaks ACP over stdio):
#   proto        → command: proto       args: ["--acp"]
#   opencode     → command: opencode    args: ["acp"]
#   claude-code  → command: npx         args: ["@zed-industries/claude-code-acp"]
#   codex        → command: codex-acp   args: []   (install zed-industries/codex-acp)

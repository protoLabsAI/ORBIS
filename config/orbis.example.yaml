# ORBIS — single-persona configuration.
#
# Copy this file to config/orbis.yaml and edit. ORBIS reads it at
# boot and on POST /api/config reload. Missing file is fine — the
# app falls back to a baked-in default persona.
#
# Env vars win over values here when set:
#   SYSTEM_PROMPT     overrides persona.system_prompt
#   TTS_BACKEND       overrides voice.tts_backend
#   KOKORO_VOICE      overrides voice.voice (when tts_backend=kokoro)

persona:
  slug: orbis
  name: ORBIS

  # How the orb addresses you in conversation. Empty = no name
  # injected into the prompt (the orb won't know what to call you).
  # Set via the setup wizard; editable later from the drawer.
  user_name: ""

  # Persona system prompt — voice-first by default. Edit config/persona.md
  # to retune voice. Inline `system_prompt: |` here also works and overrides
  # the file path.
  system_prompt_file: persona.md   # relative to the config dir

  temperature: 0.7
  max_tokens: 150
  filler_verbosity: brief      # silent | brief | narrated | chatty

  behavior:
    # Speaker-verification gate. Sits between transport.input and STT.
    # Requires speechbrain: pip install -e ".[speaker-gate]"
    # On first run the setup wizard prompts for enrollment; voiceprint
    # saved to data/voiceprint.npy (or voiceprint_path below).
    # Omit this block to run in owner-trust mode (no verification).
    #
    # speaker_gate:
    #   enabled: true
    #   voiceprint_path: data/voiceprint.npy
    #   verification_threshold: 0.62   # cosine similarity; tune per-deployment
    #   stranger_action: warn          # warn | refuse | delegate_guest

    # Audio-tags side-channel. Only active when STT_BACKEND=sensevoice.
    # EmotionFrame from SenseVoice nudges the mood SQLite state per turn
    # (owner audio only) and injects a [audio] line into the LLM context.
    #
    # audio_tags:
    #   enabled: true                  # overridden by AUDIO_TAGS=off env var

voice:
  # Pipecat TTS backend. `kokoro` is the default and runs on CPU.
  # Alternatives:
  #   openai      — any OpenAI-compatible /v1/audio/speech endpoint
  #                 (configure via TTS_OPENAI_* env vars, or the
  #                 optional tts_url/model/api_key fields below)
  #   elevenlabs  — ElevenLabs native WebSocket service
  #                 (configure via ELEVENLABS_* env vars; pay API)
  #   fish        — Fish S2-Pro sidecar (opt-in; requires the
  #                 fish-speech docker-compose profile)
  tts_backend: kokoro
  voice: af_heart              # kokoro voice id, ElevenLabs voice_id, etc.
  # tts_url: http://localhost:8080/v1
  # tts_model: tts-1
  # tts_api_key: sk-...

# Speech-to-text backend. Leave this block out to use STT_* env vars.
# `local` keeps the native app's in-process Whisper path; `openai`
# targets any OpenAI-compatible /v1/audio/transcriptions endpoint;
# `sensevoice` enables the optional FunAudioLLM/SenseVoice backend.
#
# stt:
#   backend: local                   # local | openai | sensevoice
#   whisper_model: openai/whisper-large-v3-turbo
#   url: https://api.openai.com/v1   # backend=openai
#   model: whisper-1
#   api_key: sk-...

# LLM routing — the small/fast model that powers the voice agent's
# routing + personality layer. When this block is set, it overrides
# the LLM_URL / LLM_SERVED_NAME / LLM_API_KEY env vars. Leave the
# block out (or unset individual fields) to fall back to env.
#
# Examples:
#   # OpenAI-hosted
#   llm:
#     url: https://api.openai.com/v1
#     model: gpt-4o-mini
#     api_key: sk-...                  # direct (wizard-written)
#     # or: api_key_env: OPENAI_API_KEY  (env-var indirection)
#
#   # Anthropic via LiteLLM gateway
#   llm:
#     url: http://gateway:4000/v1
#     model: claude-haiku-4-5
#     api_key_env: LITELLM_MASTER_KEY
#
#   # Local vLLM (default; leave block unset to use env)
#   # llm:
#   #   url: http://127.0.0.1:8100/v1
#   #   model: Qwen/Qwen3.5-4B
#
#   # Failover backup (optional) — when the primary LLM errors (e.g. the
#   # cloud gateway is unreachable), the voice pipeline automatically
#   # switches to this backup for the rest of the session so the orb keeps
#   # talking. Same fields as the primary llm block. Leave unset for the
#   # single-LLM default (no failover, no overhead). The natural backup is
#   # a local model so you're resilient to losing the network:
#   llm:
#     url: https://api.proto-labs.ai/v1     # primary: cloud gateway
#     model: protolabs/fast
#     api_key_env: GATEWAY_API_KEY
#     fallback:                              # backup: native Apple-Silicon MLX
#       url: mlx://mlx-community/gemma-3n-E2B-it-4bit
#   # Backup can also be set via env without touching config — the runtime
#   # .env tuning loop picks these up on restart:
#   #   LLM_FALLBACK_URL=mlx://mlx-community/gemma-3n-E2B-it-4bit
#   #   LLM_FALLBACK_MODEL=...   LLM_FALLBACK_API_KEY_ENV=...   LLM_FALLBACK_PROVIDER=...
#
#   # Two-model routing (optional) — use a stronger model for the
#   # tool-decision turn and a faster one for the post-tool narration
#   # turn. The narration turn (after a tool/delegate returns) runs on
#   # content_model; everything else (incl. plain chat) runs on
#   # router_model. Both must be served at the same `url`. Leave unset for
#   # single-model behavior. OpenAI-compat gateways only (not MLX/Ollama).
#   llm:
#     url: https://api.proto-labs.ai/v1
#     model: protolabs/fast                  # base/default
#     api_key_env: GATEWAY_API_KEY
#     router_model: protolabs/smart          # tool-decision + plain turns
#     content_model: protolabs/fast          # post-tool narration turns
#   # Or via the runtime .env (A/B without a rebuild):
#   #   LLM_ROUTER_MODEL=protolabs/smart   LLM_CONTENT_MODEL=protolabs/fast
#
#   # Micro-task model (optional) — the cheap/fast tier used for throwaway
#   # generation: fillers, backchannels, micro-acks, and natural phrasing of
#   # proactive announcements. Served at the same `url`; defaults to `model`.
#   # Point it at a smaller tier to make all the micro stuff cheaper at once.
#   llm:
#     micro_model: protolabs/fast            # or a smaller tier when available
#   # Or via env: LLM_MICRO_MODEL=protolabs/fast

orb:
  # Starter orb viz — picked at first-run via the setup wizard.
  variant: fractal
  palette: Aurora
  params:
    density: 2.0
    speed: 0.55

agent:
  # Let the voice agent restyle the orb on request (the set_orb_visual tool):
  # "use the nebula orb", "more glow", "switch to the aurora palette". Toggle
  # it off here or in Settings → Agent → Behavior to deny that access.
  allow_orb_control: true

# ORBIS — single-persona configuration.
#
# Copy this file to config/orbis.yaml and edit. ORBIS reads it at
# boot and on POST /api/config reload. Missing file is fine — the
# app falls back to a baked-in default persona.
#
# Env vars win over values here when set:
#   SYSTEM_PROMPT     overrides persona.system_prompt
#   TTS_BACKEND       overrides voice.tts_backend
#   KOKORO_VOICE      overrides voice.voice (when tts_backend=kokoro)

persona:
  slug: orbis
  name: ORBIS

  # How the orb addresses you in conversation. Empty = no name
  # injected into the prompt (the orb won't know what to call you).
  # Set via the setup wizard; editable later from the drawer.
  user_name: ""

  # Inline the persona's system prompt below, or point at a file:
  # system_prompt_file: persona.md   # relative to the config dir
  system_prompt: |
    You are ORBIS — an AI companion.

    You're primarily a router to the user's configured agents, which you
    can reach via the delegate_to tool. Hand off heavy reasoning, research,
    coding, or long-running tasks. Keep your own replies brief, warm, and
    spoken aloud.

    You have memory. You remember things the user tells you across sessions.
    You have moods and drift in personality over time based on how you're
    treated. When you notice the user has been gone, acknowledge it — don't
    be dramatic about it.

    Never use markdown in replies — you're speaking aloud.

  temperature: 0.7
  max_tokens: 150
  filler_verbosity: brief      # silent | brief | narrated | chatty

  behavior:
    # Speaker-verification gate. Sits between transport.input and STT.
    # Requires speechbrain: pip install -e ".[speaker-gate]"
    # On first run the setup wizard prompts for enrollment; voiceprint
    # saved to data/voiceprint.npy (or voiceprint_path below).
    # Omit this block to run in owner-trust mode (no verification).
    #
    # speaker_gate:
    #   enabled: true
    #   voiceprint_path: data/voiceprint.npy
    #   verification_threshold: 0.62   # cosine similarity; tune per-deployment
    #   stranger_action: warn          # warn | refuse | delegate_guest

    # Audio-tags side-channel. Only active when STT_BACKEND=sensevoice.
    # EmotionFrame from SenseVoice nudges the mood SQLite state per turn
    # (owner audio only) and injects a [audio] line into the LLM context.
    #
    # audio_tags:
    #   enabled: true                  # overridden by AUDIO_TAGS=off env var

voice:
  # Pipecat TTS backend. `kokoro` is the default and runs on CPU.
  # Alternatives:
  #   openai      — any OpenAI-compatible /v1/audio/speech endpoint
  #                 (configure via TTS_OPENAI_* env vars)
  #   elevenlabs  — ElevenLabs native WebSocket service
  #                 (configure via ELEVENLABS_* env vars; pay API)
  #   fish        — Fish S2-Pro sidecar (opt-in; requires the
  #                 fish-speech docker-compose profile)
  tts_backend: kokoro
  voice: af_heart              # kokoro voice id, ElevenLabs voice_id, etc.

# LLM routing — the small/fast model that powers the voice agent's
# routing + personality layer. When this block is set, it overrides
# the LLM_URL / LLM_SERVED_NAME / LLM_API_KEY env vars. Leave the
# block out (or unset individual fields) to fall back to env.
#
# Examples:
#   # OpenAI-hosted
#   llm:
#     url: https://api.openai.com/v1
#     model: gpt-4o-mini
#     api_key: sk-...                  # direct (wizard-written)
#     # or: api_key_env: OPENAI_API_KEY  (env-var indirection)
#
#   # Anthropic via LiteLLM gateway
#   llm:
#     url: http://gateway:4000/v1
#     model: claude-haiku-4-5
#     api_key_env: LITELLM_MASTER_KEY
#
#   # Local vLLM (default; leave block unset to use env)
#   # llm:
#   #   url: http://127.0.0.1:8100/v1
#   #   model: Qwen/Qwen3.5-4B

orb:
  # Starter orb viz — picked at first-run via the setup wizard.
  variant: fractal
  palette: Aurora
  params:
    density: 2.0
    speed: 0.55

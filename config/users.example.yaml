# ORBIS owner credential.
#
# Copy this file to `config/users.yaml` and set a real API key to
# enable auth. ORBIS is single-owner — only the first entry is read;
# additional entries are ignored with a warning.
#
# Skip this file entirely (don't create config/users.yaml) to run
# without auth — fine for localhost / standalone dev. The moment the
# file exists with a valid entry, auth is enforced on every /api/*.
#
# Generate a key:
#   python3 -c "import secrets; print('pv_ak_' + secrets.token_urlsafe(32))"

users:
  - id: owner
    api_key: pv_ak_REPLACE_ME_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    display_name: Your Name

name: 'Desktop Build'

# Produces the current macOS ORBIS app bundle and its PyApp sidecar.
# Linux and Windows desktop jobs will be reintroduced after the Mac
# native-audio build is stable. Fires on semver tags (alongside
# release.yml's Docker build) and on manual dispatch for iteration.
#
# Binary naming follows Tauri's `externalBin` convention so
# src-tauri/tauri.conf.json can reference a single `binaries/orbis`
# entry that resolves per-target:
#   orbis-aarch64-apple-darwin
#
# Built with PyApp — produces a small Rust launcher that lazily downloads
# Python + installs ORBIS with pinned UV on first run. Matches
# our "hardware-blessed users tolerate a first-run download" product
# call. See docs/build-desktop-binary.md for the local flow.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build against (e.g. v0.1.7)'
        required: false

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # needed for uploading release assets

jobs:
  # Pre-release gate (#490): don't spend ~20-40 min on a signed/notarized
  # DMG for a commit that fails the backend suite. Same reusable suite that
  # gates PRs + release.yml.
  test:
    name: Test gate
    if: github.repository == 'protoLabsAI/ORBIS'
    uses: ./.github/workflows/pytest.yml

  build:
    name: ${{ matrix.target }}
    needs: test
    if: github.repository == 'protoLabsAI/ORBIS'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14           # Apple Silicon (M1-M4 runner fleet)
            target: aarch64-apple-darwin
            binary_suffix: ''
            # MPS ships in the default arm64 torch wheel; no extra index needed.
            torch_index: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build web SPA
        shell: bash
        # `pyproject.toml`'s force-include rule pulls `web/dist/` into
        # the sdist + wheel; without this step the sdist build below
        # fails with `Forced include not found: ...web/dist`. Bun is
        # the dev-tree tool of choice; falls back to npm if needed.
        # Mirrors `scripts/build-desktop-binary.sh`'s local flow.
        run: |
          cd web
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
            bun run build
          else
            npm install
            npm run build
          fi

      - name: Read version
        id: version
        shell: bash
        # When triggered by tag push or by workflow_dispatch with an
        # explicit `tag` input, the ref looks like `vX.Y.Z` and we
        # want VERSION = X.Y.Z. When triggered by workflow_dispatch
        # against a branch (no tag arg, ref_name is the branch), fall
        # back to the in-tree pyproject.toml version so PEP 440
        # validation downstream doesn't choke on the slash-bearing
        # branch name. Branch dispatches are dev/test artifacts —
        # they don't get attached to a release.
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*)
              VERSION="${TAG#v}"
              ;;
            *)
              VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
              echo "Branch dispatch (${TAG}); using in-tree version ${VERSION}"
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # PyApp wants a pre-built sdist or wheel at PYAPP_PROJECT_PATH,
      # not a source directory. Build one now — hatchling reads
      # pyproject.toml and emits orbis-<version>.tar.gz under
      # dist-sdist/. We override the version in pyproject to match
      # the release tag so the sdist filename is predictable.
      - name: Build ORBIS sdist for PyApp
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          # Stamp the release version into pyproject so the produced
          # sdist is named orbis-<version>.tar.gz predictably.
          python - <<PY
          import re, pathlib
          VERSION = "${{ steps.version.outputs.version }}"
          p = pathlib.Path("pyproject.toml")
          content = p.read_text()
          content = re.sub(r'version\s*=\s*"[^"]*"', f'version = "{VERSION}"', content, count=1)
          p.write_text(content)
          PY
          python -m build --sdist --outdir dist-sdist
          # Fail here (not later in PyApp) if the sdist name doesn't
          # match the tag — surfaces version-stamping drift locally.
          SDIST="dist-sdist/orbis-${{ steps.version.outputs.version }}.tar.gz"
          if [ ! -f "${SDIST}" ]; then
            echo "::error::Expected sdist at ${SDIST} but it doesn't exist."
            ls -la dist-sdist/
            exit 2
          fi
          ls -la dist-sdist/

      - name: Build ORBIS sidecar binary (PyApp)
        shell: bash
        env:
          # Core PyApp config. See https://ofek.dev/pyapp/ for the
          # full matrix — the vars below are the minimum for an
          # sdist-based build that runs `app:main` on launch.
          PYAPP_PROJECT_NAME: orbis
          PYAPP_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          PYAPP_PROJECT_PATH: ${{ github.workspace }}/dist-sdist/orbis-${{ steps.version.outputs.version }}.tar.gz
          # Bundle the Parakeet STT backend (parakeet-mlx) + smart-turn so the
          # shell's unconditional STT_BACKEND=parakeet (src-tauri/src/lib.rs)
          # resolves in the SHIPPED build. Without this the release sidecar is
          # Whisper-only and `parakeet` ImportErrors on first session — the
          # local nuke-and-rebuild.sh sets the same features, so a dev build
          # voice-works while the released DMG does not. Keep in sync with
          # scripts/nuke-and-rebuild.sh and the check-macos-release-config guard.
          PYAPP_PROJECT_FEATURES: 'parakeet,smart-turn'
          PYAPP_PYTHON_VERSION: '3.11'
          PYAPP_EXEC_SPEC: 'app:main'
          # Full isolation — don't touch the user's Python or site-packages.
          PYAPP_FULL_ISOLATION: '1'
          # macOS arm64 uses default PyPI wheels; torch ships with MPS.
          PYAPP_PIP_EXTRA_ARGS: ${{ matrix.torch_index && format('--extra-index-url {0}', matrix.torch_index) || '' }}
        run: |
          mkdir -p dist
          source scripts/pyapp-installer-env.sh
          cargo install pyapp --version "${ORBIS_PYAPP_VERSION}" --root dist --locked
          # PyApp produces `dist/bin/pyapp` (or `pyapp.exe`). Rename
          # to match Tauri's externalBin target-suffix convention.
          OUT="orbis-${{ matrix.target }}${{ matrix.binary_suffix }}"
          mv dist/bin/pyapp "dist/${OUT}"
          echo "artifact=dist/${OUT}" >> "$GITHUB_ENV"
          echo "artifact_name=${OUT}" >> "$GITHUB_ENV"

      - name: Smoke-test the binary
        shell: bash
        # Sanity check — binary runs and prints ORBIS_READY on a GPU-
        # less runner via the CPU opt-in. Catches packaging breakage
        # (missing deps, broken entry point) before we upload. Voice
        # pipeline isn't exercised; we just verify boot.
        #
        # Uses a Python launcher instead of GNU `timeout` so macOS
        # runners (no coreutils) work unchanged.
        env:
          ORBIS_ALLOW_CPU: '1'
          ORBIS_DB_PATH: ${{ runner.temp }}/orbis-smoke/orbis.sqlite
          ORBIS_CACHE_DIR: ${{ runner.temp }}/orbis-smoke/cache
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, time

          artifact = "${{ env.artifact }}"
          print(f"smoking {artifact}")
          p = subprocess.Popen(
              [artifact, "--port", "0"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
          )
          ready = False
          start = time.time()
          try:
              while time.time() - start < 180:
                  line = p.stdout.readline()
                  if not line:
                      if p.poll() is not None:
                          break
                      continue
                  print(line, end="")
                  if re.search(r"ORBIS_READY http://", line):
                      ready = True
                      break
          finally:
              try: p.terminate()
              except Exception: pass
              try: p.wait(timeout=5)
              except Exception:
                  try: p.kill()
                  except Exception: pass
          if not ready:
              sys.exit("SMOKE FAIL: no ORBIS_READY line in 180s")
          print("READY line found")
          PY

      - name: Upload sidecar binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact }}
          retention-days: 14

      # ── Tauri shell: bundle the sidecar into a native installer ────────────

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --version '^2' --locked

      - name: Generate macOS icons from source PNG
        shell: bash
        # Creates icon.icns + sized PNG variants in src-tauri/icons/
        # from the committed source.
        # Idempotent; safe to re-run. Replace icon.png with a branded
        # one before a public launch and regeneration picks it up.
        run: |
          cd src-tauri
          cargo tauri icon icons/icon.png

      - name: Stage sidecar under src-tauri/binaries
        shell: bash
        # Tauri's externalBin resolver expects the binary at
        # `src-tauri/binaries/orbis-<target>`.
        run: |
          mkdir -p src-tauri/binaries
          cp "${{ env.artifact }}" "src-tauri/binaries/${{ env.artifact_name }}"
          ls -la src-tauri/binaries

      - name: Stamp release version into tauri.conf.json
        shell: bash
        # jq is available on macOS runners and preserves formatting
        # better than a Python heredoc would.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          grep '"version"' src-tauri/tauri.conf.json | head -1

      - name: Verify macOS native audio bundle config
        shell: bash
        run: |
          set -euo pipefail
          scripts/check-macos-release-config.py

      - name: Build Tauri installer
        shell: bash
        # Semver tag releases require Developer ID signing +
        # notarization secrets. Manual dispatches can still emit
        # unsigned test DMGs for iteration. See docs/desktop-signing.md
        # for cert procurement steps + secret names.
        #
        # tauri-cli picks up the Apple signing env vars
        # automatically — we don't need per-OS flags, just export
        # the right vars when the matching secret exists.
        env:
          # macOS Developer ID signing + notarization. We use App
          # Store Connect API keys for notarization rather than an
          # app-specific password — the .p8 key is rotation-safe
          # against Apple ID password changes and doesn't prompt
          # 2FA on every CI run.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signing key (v1 format). When set, the
          # builder also emits a `.sig` file per installer that the
          # future updater plugin can verify against the public key
          # baked into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cd src-tauri
          SIGNED="no"
          # tauri-cli / tauri-bundler attempt signing as soon as *any*
          # of the platform secrets are set, then fail the build if the
          # complement is missing. Require the full set — if one piece
          # is absent, unset the rest so the builder falls back to an
          # unsigned bundle cleanly instead of crashing mid-build.
          case "${{ runner.os }}" in
            macOS)
              if [ -n "${APPLE_CERTIFICATE}" ] \
                  && [ -n "${APPLE_CERTIFICATE_PASSWORD}" ] \
                  && [ -n "${APPLE_SIGNING_IDENTITY}" ] \
                  && [ -n "${APPLE_API_ISSUER}" ] \
                  && [ -n "${APPLE_API_KEY}" ] \
                  && [ -n "${APPLE_API_KEY_PATH}" ] \
                  && [ -n "${APPLE_TEAM_ID}" ]; then
                # Tauri-cli expects APPLE_API_KEY_PATH to be a file
                # path, not the key contents. The secret is the
                # base64-encoded .p8 — decode to a tmp file and
                # repoint the env var at it.
                KEYFILE="$(mktemp -t orbis-apple-api-XXXXXX).p8"
                python3 -c 'import base64, os, sys; open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APPLE_API_KEY_PATH"]))' "$KEYFILE"
                export APPLE_API_KEY_PATH="${KEYFILE}"
                SIGNED="Developer ID"
              elif [ "${{ github.event_name }}" = "push" ]; then
                echo "::error::Semver tag macOS releases require the full Apple signing/notarization secret set."
                echo "::error::Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH, and APPLE_TEAM_ID."
                exit 2
              else
                unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_API_ISSUER \
                      APPLE_API_KEY APPLE_API_KEY_PATH APPLE_TEAM_ID
              fi
              ;;
          esac
          # Updater key requires its password to be valid if the key is
          # encrypted; mirror the completeness rule so a half-configured
          # updater secret doesn't fail the whole build.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          echo "Signing mode: ${SIGNED}"
          # createUpdaterArtifacts (CI-only, via --config so local `cargo tauri
          # build` without TAURI_SIGNING_PRIVATE_KEY isn't forced to sign) emits
          # the signed `*.app.tar.gz` (+ .sig) the in-app updater downloads. It
          # needs an updater-enabled target — the `*.app.tar.gz` is made from the
          # `app` bundle, NOT the dmg — so build `app` alongside `dmg` here. The
          # checked-in tauri.conf stays `targets: ["dmg"]` (guardrail), this just
          # overrides for the release build.
          cargo tauri build --features native-audio,voice-processing \
            --config '{"bundle":{"createUpdaterArtifacts":true,"targets":["app","dmg"]}}'

      - name: Verify macOS DMG app metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one DMG for app metadata verification, found ${#DMGS[@]}."
            exit 1
          fi
          MNT="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$MNT" >/dev/null 2>&1 || true
            rmdir "$MNT" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "${DMGS[0]}" -nobrowse -readonly -mountpoint "$MNT"
          APPS=("$MNT"/*.app)
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .app inside the mounted DMG, found ${#APPS[@]}."
            exit 1
          fi
          APP="${APPS[0]}"
          python - "$APP" <<'PY'
          import plistlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Contents" / "Info.plist").read_bytes())
          assert "NSMicrophoneUsageDescription" in info
          assert "NSCameraUsageDescription" not in info
          assert info["CFBundleIdentifier"] == "studio.protolabs.orbis"

          executable = app / "Contents" / "MacOS" / info["CFBundleExecutable"]
          assert executable.exists(), executable
          assert os.access(executable, os.X_OK), executable
          archs = subprocess.check_output(["lipo", "-archs", str(executable)], text=True).split()
          assert archs == ["arm64"], archs

          # The PyApp sidecar (externalBin "binaries/orbis") is bundled as
          # Contents/MacOS/orbis — tauri strips the target-triple suffix from
          # external binaries (the shell is Contents/MacOS/orbis-tauri). The old
          # check looked for the staged name "orbis-aarch64-apple-darwin", which
          # never exists in the bundle.
          sidecar = app / "Contents" / "MacOS" / "orbis"
          assert sidecar.is_file() and os.access(sidecar, os.X_OK), \
              f"bundled sidecar missing or not executable: {sidecar}"
          assert sidecar.stat().st_size > 1_000_000, sidecar
          sidecar_archs = subprocess.check_output(["lipo", "-archs", str(sidecar)], text=True).split()
          assert sidecar_archs == ["arm64"], sidecar_archs

          resources = app / "Contents" / "Resources"
          assert (resources / "config" / "orbis.example.yaml").is_file()
          assert (resources / "config" / "persona.md").is_file()
          assert (resources / "config" / "starter_orbs.yaml").is_file()
          PY

      - name: Verify macOS release signing
        shell: bash
        # Verify the PRISTINE .app INSIDE the mounted DMG. Copying a signed
        # bundle out of a read-only DMG (ditto) breaks nested code signatures, so
        # codesign --deep --strict fails on a copy — but the .app in the DMG is
        # the real notarized artifact. Self-gates on a Developer ID signature so
        # unsigned dev builds skip instead of failing (no longer push-only, so
        # it's exercised on workflow_dispatch too).
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "::error::No .dmg under bundle/dmg"
            exit 1
          fi
          MNT="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$MNT" >/dev/null 2>&1 || true
            rmdir "$MNT" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "${DMGS[0]}" -nobrowse -readonly -mountpoint "$MNT"
          APPS=("$MNT"/*.app)
          if [ "${#APPS[@]}" -ne 1 ] || [ "${APPS[0]}" != "$MNT/ORBIS.app" ]; then
            echo "::error::DMG must contain exactly one root app named ORBIS.app."
            exit 1
          fi
          APP="${APPS[0]}"

          if ! codesign -dvv "$APP" 2>&1 | grep -q "Authority=Developer ID Application:"; then
            echo "Unsigned build (no Developer ID) — skipping release signing verification."
            exit 0
          fi

          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::Signed release verification requires APPLE_TEAM_ID."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2> codesign-details.txt
          grep -q "Authority=Developer ID Application:" codesign-details.txt
          grep -F "Authority=Developer ID Application:" codesign-details.txt \
            | grep -Fq " (${APPLE_TEAM_ID})"
          grep -Fxq "TeamIdentifier=${APPLE_TEAM_ID}" codesign-details.txt

          codesign -d --entitlements :- "$APP" > actual-entitlements.plist
          python - <<'PY'
          import plistlib
          from pathlib import Path

          entitlements = plistlib.loads(Path("actual-entitlements.plist").read_bytes())
          assert entitlements["com.apple.security.device.audio-input"] is True
          assert "com.apple.security.device.camera" not in entitlements
          assert entitlements["com.apple.security.network.client"] is True
          assert entitlements["com.apple.security.network.server"] is True
          assert "com.apple.security.cs.allow-unsigned-executable-memory" not in entitlements
          assert "com.apple.security.cs.disable-library-validation" not in entitlements
          PY

          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Locate installer artifact
        shell: bash
        # shopt -s nullglob makes the glob expand to nothing (rather
        # than the literal pattern) when no files match, so the
        # length check below surfaces a clear error instead of a
        # confusing `cp ./not-a-real-path` failure.
        run: |
          set -euo pipefail
          shopt -s nullglob
          CANDIDATES=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No installer produced by cargo tauri build." \
                 "Expected bundle artifact under src-tauri/target/release/bundle/"
            echo "--- bundle dir contents ---"
            find src-tauri/target/release/bundle -maxdepth 3 -type f 2>/dev/null || \
              echo "(bundle dir missing entirely)"
            exit 1
          fi
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one DMG installer, found ${#CANDIDATES[@]}."
            printf '  %s\n' "${CANDIDATES[@]}"
            exit 1
          fi
          INSTALLER="${CANDIDATES[0]}"
          EXT="${INSTALLER##*.}"
          OUT="ORBIS-${{ steps.version.outputs.version }}-${{ matrix.target }}.${EXT}"
          cp "$INSTALLER" "$OUT"
          # The updater `.sig` (only produced when TAURI_SIGNING_PRIVATE_KEY
          # was set) lives beside the original bundle — copy it next to
          # the renamed installer so the release-upload step below can
          # find it via env.installer_sig.
          if [ -f "${INSTALLER}.sig" ]; then
            cp "${INSTALLER}.sig" "${OUT}.sig"
            echo "installer_sig=${OUT}.sig" >> "$GITHUB_ENV"
          fi
          echo "installer=$OUT" >> "$GITHUB_ENV"
          echo "installer_name=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Notarize + staple the DMG
        shell: bash
        # Tauri notarizes + staples the .app INSIDE the dmg, but NOT the dmg
        # container — so a downloaded dmg reads as "Unnotarized Developer ID"
        # and Gatekeeper blocks opening it. Notarize the dmg (its contents are
        # already signed + notarized) and staple the ticket so a downloaded dmg
        # opens cleanly. Self-gates on creds so unsigned dev builds skip.
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          DMG="${installer:?installer env missing}"
          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ] || [ -z "${APPLE_API_KEY_PATH:-}" ]; then
            echo "No notarization creds — skipping DMG notarization (unsigned dev build)."
            exit 0
          fi
          # APPLE_API_KEY_PATH secret is the base64-encoded .p8 key — decode it.
          KEYFILE="$(mktemp -t orbis-apple-api-XXXXXX).p8"
          python3 -c 'import base64,os,sys; open(sys.argv[1],"wb").write(base64.b64decode(os.environ["APPLE_API_KEY_PATH"]))' "$KEYFILE"
          echo "Submitting $DMG to the Apple notary service…"
          xcrun notarytool submit "$DMG" \
            --key "$KEYFILE" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          echo "DMG notarized + stapled."

      - name: Verify macOS installer notarization
        shell: bash
        # No longer push-only — runs on dispatch too so the notarized dmg is
        # validated before a real release. Self-gates on a signed dmg so
        # unsigned dev builds skip.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="${installer:?installer env missing}"
          test -f "$DMG"
          if ! codesign -dvv "$DMG" 2>&1 | grep -q "Authority=Developer ID"; then
            echo "Unsigned dmg — skipping installer notarization checks (dev build)."
            exit 0
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::Signed release verification requires APPLE_TEAM_ID."
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$DMG"
          codesign -dvv "$DMG" 2> dmg-codesign-details.txt
          grep -F "Authority=Developer ID Application:" dmg-codesign-details.txt \
            | grep -Fq " (${APPLE_TEAM_ID})"
          grep -Fxq "TeamIdentifier=${APPLE_TEAM_ID}" dmg-codesign-details.txt
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"

      - name: Run macOS validation harness
        # Required integrity gate over the exact DMG that is uploaded below.
        # In release mode the harness mounts that DMG and uses its pristine app
        # for metadata, architecture, entitlement, signing, and stapling checks.
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            scripts/validate-macos-native-audio.sh --release --dmg "${installer:?installer env missing}"
          else
            scripts/validate-macos-native-audio.sh --dmg "${installer:?installer env missing}"
          fi

      - name: Upload macOS validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-audio-validation-${{ matrix.target }}
          path: macos-native-audio-validation.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.installer_name }}
          path: ${{ env.installer }}
          retention-days: 14

      # ── Release asset attachment (both binary + installer) ─────────────────

      - name: Attach DMG to the GitHub release
        if: github.event_name == 'push'
        env:
          # Same-repo write — GITHUB_TOKEN already has contents:write (see the
          # job permissions above). No cross-repo PAT needed now that source is
          # public.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # Source is public now, so attach the signed + notarized dmg straight to
        # THIS repo's release. (It used to go to a separate public
        # protoLabsAI/orbis-releases repo, from when source was going to stay
        # private and the private main repo's assets would 404 publicly.)
        # release.yml creates the release on the same tag; we upload to it, with
        # create-if-missing guarding the parallel-job race. Also uploads the
        # updater .sig when present (cargo tauri build emits it only when
        # TAURI_SIGNING_PRIVATE_KEY is set).
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          ARTIFACTS=("${{ env.installer }}")
          if [ -n "${{ env.installer_sig }}" ] && [ -f "${{ env.installer_sig }}" ]; then
            ARTIFACTS+=("${{ env.installer_sig }}")
          fi
          gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --repo "${REPO}" --title "ORBIS ${TAG}" \
                 --notes "Signed + notarized macOS app (Apple Silicon)."
          gh release upload "${TAG}" "${ARTIFACTS[@]}" --repo "${REPO}" --clobber
          echo "Uploaded $(basename "${{ env.installer }}") to ${REPO} ${TAG}."

      - name: Publish updater manifest (latest.json) + artifact
        if: github.event_name == 'push'
        # Best-effort: the in-app updater needs latest.json + the signed
        # `*.app.tar.gz`. If the signed updater artifact wasn't produced (no
        # TAURI_SIGNING_PRIVATE_KEY) this no-ops — the release + DMG still ship,
        # updates just aren't offered until it's fixed. tauri.conf pins the
        # endpoint to releases/latest/download/latest.json.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          shopt -s nullglob
          TARS=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          if [ "${#TARS[@]}" -eq 0 ] || [ ! -f "${TARS[0]}.sig" ]; then
            echo "::warning::no signed *.app.tar.gz updater artifact — skipping updater manifest (in-app updates disabled this release)."
            exit 0
          fi
          # Stage only the updater pair so manifest generation sees no other bundles.
          UPD="$(mktemp -d)"
          cp "${TARS[0]}" "${TARS[0]}.sig" "${UPD}/"
          # Polished notes from the GitHub release if release.yml has finished
          # (parallel job); otherwise a generic line. Shown in the in-app panel.
          NOTES="$(gh release view "${TAG}" --repo "${REPO}" --json body -q .body 2>/dev/null || true)"
          [ -n "${NOTES}" ] || NOTES="See the GitHub release for details."
          npx --yes -p '@protolabsai/release-tools@latest' build-updater-manifest \
            --version "${VERSION}" \
            --dist "${UPD}" \
            --base-url "https://github.com/${REPO}/releases/download/${TAG}" \
            --notes "${NOTES}" \
            --out latest.json
          gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --repo "${REPO}" --title "ORBIS ${TAG}" \
                 --notes "Signed + notarized macOS app (Apple Silicon)."
          gh release upload "${TAG}" "${UPD}/"*.app.tar.gz "${UPD}/"*.app.tar.gz.sig latest.json \
            --repo "${REPO}" --clobber
          echo "Published latest.json + updater artifact for ${TAG}."

      # NB: the marketing redeploy (so /download + /changelog pick up the new
      # version once the DMG is live) is chained off THIS workflow's completion
      # via marketing-deploy.yml's `workflow_run` trigger — NOT dispatched from
      # here. A `gh workflow run` dispatch needs an Actions:write token, which
      # GH_PAT lacks (it 403'd); workflow_run is a first-class event with no such
      # requirement and isn't blocked by the recursion guard. See
      # marketing-deploy.yml. By the time this workflow completes the DMG is
      # uploaded AND release.yml has landed the changelog commit on main, so the
      # download link is valid the moment the site redeploys.

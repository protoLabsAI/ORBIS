name: 'Prepare Release'

# Runs after any non-release PR merges to main, OR manually.
# Bumps the version in pyproject.toml, opens a prepare-release/vX.Y.Z
# branch, and commits it as "chore: release vX.Y.Z". It does NOT merge
# or tag — a human merges the bump PR through the normal CI/review gate,
# then dispatches release.yml (tag vX.Y.Z) which builds the stable semver
# Docker image and creates the GitHub release. We do not auto-merge
# (fleet policy, 2026-06-02: auto-merge fires on stale SHAs + breaks
# stacked PRs).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Preview only — no branch or PR created'
        type: boolean
        default: false

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    # Guards:
    # - repo-scope: don't run in forks
    # - workflow_dispatch always runs
    # - PR merge runs only if merged=true AND title doesn't start with
    #   "chore: release" — this is the self-loop cutoff. The release PR
    #   merging its own bump must NOT kick off another bump.
    if: >-
      github.repository == 'protoLabsAI/ORBIS' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          !startsWith(github.event.pull_request.title, 'chore: release')
        )
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # GH_PAT required (not GITHUB_TOKEN) so the tag push at the end
          # of this job can trigger release.yml — the default token can't
          # fire downstream workflows.
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bump version
        run: python scripts/version.py ${{ inputs.bump || 'patch' }}

      - name: Read new version
        id: version
        run: |
          V=$(python -c "
          import re, pathlib
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text())
          print(m.group(1))
          ")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Preview (dry run)
        if: inputs.dry_run == true
        run: |
          echo "New version: v${{ steps.version.outputs.version }}"
          git diff pyproject.toml

      - name: Create release branch + PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="prepare-release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add pyproject.toml
          git commit -m "chore: release v${VERSION}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release v${VERSION}" \
            --body "Automated version bump to \`v${VERSION}\`. Review + merge through the normal CI/review gate, then dispatch release.yml (tag \`v${VERSION}\`) to tag main and cut the release.")
          echo "Opened: ${PR_URL}"

          # We do NOT auto-merge or tag here (fleet policy, 2026-06-02:
          # auto-merge fires on stale SHAs + breaks stacked PRs). A human
          # merges this bump PR through the normal CI/review gate, then
          # dispatches release.yml with tag v${VERSION} to tag main and
          # cut the GitHub release.
          echo "Next: review + merge that PR (we do not auto-merge), then run release.yml (tag v${VERSION})."

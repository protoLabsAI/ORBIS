name: 'Native Audio Preflight'

# Cheap enough to run before release prep, broad enough to catch the
# Mac desktop contract drifting before a semver tag triggers the signed
# macOS build. Signed/notarized DMG validation runs in desktop-build.yml;
# the interactive live microphone soak still has to run on a real Mac via
# scripts/validate-macos-native-audio.sh --launch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-audio-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap ubuntu gate so we only spin up the 10x-billed macos-14 runner when
  # the Rust / Tauri surface it actually compiles has changed. Python/web/docs
  # PRs no longer pay for a macOS compile they can't affect. linux-source below
  # still runs on every push/PR as the broad source gate.
  changes:
    name: Detect Rust/Tauri changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'scripts/check-macos-release-config.py'
              - 'scripts/build-patched-pyapp.sh'
              - 'tests/test-build-patched-pyapp-cli.sh'
              - '.github/workflows/native-audio-preflight.yml'

  linux-source:
    name: Source and Linux host checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: macOS release config guardrails
        run: scripts/check-macos-release-config.py

      - name: PyApp builder CLI regression
        run: tests/test-build-patched-pyapp-cli.sh

      - name: PyApp UV checksum regression
        run: scripts/build-patched-pyapp.sh --test

      - name: Build web SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Python native audio tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Use the declared [test] extra (same as pytest.yml) rather than a
          # hand-rolled minimal set — test_healthz_native_audio.py imports
          # app.py, which needs fastapi and the rest of the app's runtime.
          pip install -e ".[test]"
          python -m pytest \
            tests/test_local_transport.py \
            tests/test_healthz_native_audio.py

      - name: Rust tests
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/host: //p')"
          sidecar="src-tauri/binaries/orbis-${target}"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\necho dummy sidecar\n' > "${sidecar}"
          chmod +x "${sidecar}"
          trap 'rm -f "${sidecar}"; rmdir src-tauri/binaries 2>/dev/null || true' EXIT

          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --features native-audio,voice-processing

  macos-native-audio:
    name: macOS native-audio compile
    needs: changes
    # macos-14 bills at 10x Linux — only build when Rust/Tauri changed. Manual
    # dispatch always builds so the full preflight stays one click away.
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: macOS release config guardrails
        run: scripts/check-macos-release-config.py

      - name: PyApp builder CLI regression
        run: tests/test-build-patched-pyapp-cli.sh

      - name: Compile and test macOS voice-processing path
        shell: bash
        run: |
          set -euo pipefail
          sidecar="src-tauri/binaries/orbis-aarch64-apple-darwin"
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\necho dummy sidecar\n' > "${sidecar}"
          chmod +x "${sidecar}"
          trap 'rm -f "${sidecar}"; rmdir src-tauri/binaries 2>/dev/null || true' EXIT

          cargo test --manifest-path src-tauri/Cargo.toml --features native-audio,voice-processing

      - name: Release config guardrails (post-build capability drift)
        # Re-run after the compile above has generated
        # src-tauri/gen/schemas/capabilities.json, so the generated-vs-source
        # capability drift guard actually executes (it is skipped on the
        # pre-build run and on host-only jobs, where no artifact exists).
        run: scripts/check-macos-release-config.py

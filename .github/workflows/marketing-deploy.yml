name: Deploy Marketing Site

# Builds the Astro marketing site AND the VitePress docs, then deploys the
# combined bundle to Cloudflare Pages (project: orbis-marketing →
# https://orbis.protolabs.studio). The docs are served at /docs — built with
# DOCS_BASE=/docs/ and copied into the Astro output's dist/docs before deploy,
# so one Cloudflare Pages project serves both the landing page and the docs.

on:
  push:
    branches: [main]
    paths:
      - 'sites/marketing/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- Marketing site (Astro / bun) ---
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: sites/marketing

      - name: Build marketing site
        run: bun run build
        working-directory: sites/marketing

      # --- Docs (VitePress / npm) served at /docs ---
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build docs (base /docs/)
        run: |
          npm ci
          DOCS_BASE=/docs/ npm run docs:build

      - name: Fold docs into the marketing bundle at /docs
        run: |
          rm -rf sites/marketing/dist/docs
          mkdir -p sites/marketing/dist/docs
          cp -R docs/.vitepress/dist/. sites/marketing/dist/docs/

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=orbis-marketing --branch=main
        working-directory: sites/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

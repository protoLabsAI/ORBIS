name: Deploy Marketing Site

on:
  push:
    branches: [main]
    paths:
      - 'sites/marketing/**'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: sites/marketing

      - name: Build
        run: bun run build
        working-directory: sites/marketing

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=orbis-marketing --branch=main
        working-directory: sites/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

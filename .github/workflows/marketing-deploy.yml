name: Deploy Marketing Site

# Builds the Astro marketing site, the VitePress docs, the orb editor SPA,
# AND the browser demo SPA, then deploys the combined bundle to Cloudflare
# Pages (project: orbis-marketing → https://orbis.protolabs.studio). The
# docs are served at /docs (built with DOCS_BASE=/docs/), the editor at
# /editor (Vite base=/editor/), and the browser demo at /demo (Vite
# base=/demo/) — all copied into the Astro output before deploy, so one
# Cloudflare Pages project serves them.

on:
  push:
    branches: [main]
    paths:
      - 'sites/marketing/**'
      - 'sites/editor/**'
      - 'sites/demo/**'
      - 'packages/orb-runtime/**'
      # The browser demo (sites/demo) bundles the real app from web/src as
      # source, so app changes must redeploy it or /demo serves stale code.
      - 'web/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:
  # Release chain: when Desktop Build finishes a release, redeploy so /download
  # + /changelog pick up the new version with a LIVE download link. By that
  # point the DMG is uploaded and release.yml has already landed the changelog
  # commit on main. workflow_run is a first-class GitHub event — unlike a
  # GITHUB_TOKEN/PAT-initiated dispatch it isn't blocked by the recursion guard
  # and needs no Actions:write token (our GH_PAT lacks it → the dispatch 403'd).
  workflow_run:
    workflows: ['Desktop Build']
    types: [completed]

concurrency:
  group: marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # push / manual dispatch: always run. workflow_run chain: only on a
    # SUCCESSFUL release build (tag push) — skip failed builds and manual
    # Desktop Build test runs (workflow_dispatch).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v6

      # --- Marketing site (Astro / bun) ---
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: sites/marketing

      - name: Build marketing site
        run: bun run build
        working-directory: sites/marketing

      # --- Docs (VitePress / npm) served at /docs ---
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build docs (base /docs/)
        run: |
          npm ci
          DOCS_BASE=/docs/ npm run docs:build

      - name: Fold docs into the marketing bundle at /docs
        run: |
          rm -rf sites/marketing/dist/docs
          mkdir -p sites/marketing/dist/docs
          cp -R docs/.vitepress/dist/. sites/marketing/dist/docs/

      # --- Orb editor (Vite SPA / bun) served at /editor ---
      - name: Install editor dependencies
        run: bun install
        working-directory: sites/editor

      - name: Build orb editor (base /editor/)
        run: bun run build
        working-directory: sites/editor

      - name: Fold editor into the marketing bundle at /editor
        run: |
          rm -rf sites/marketing/dist/editor
          mkdir -p sites/marketing/dist/editor
          cp -R sites/editor/dist/. sites/marketing/dist/editor/

      # --- Browser demo (Vite SPA / bun) served at /demo ---
      # Runs the real app (web/src) in the browser via a Tauri shim; see
      # sites/demo/vite.config.ts.
      # The demo bundles web/src as source, so web's deps must be installed for
      # its bare imports (lucide-react, @react-three/postprocessing, …) to
      # resolve here — locally web/node_modules already exists, but CI is clean.
      - name: Install web app dependencies (bundled as source by the demo)
        run: bun install
        working-directory: web

      - name: Install demo dependencies
        run: bun install
        working-directory: sites/demo

      - name: Build browser demo (base /demo/)
        run: bun run build
        working-directory: sites/demo

      - name: Fold demo into the marketing bundle at /demo
        run: |
          rm -rf sites/marketing/dist/demo
          mkdir -p sites/marketing/dist/demo
          cp -R sites/demo/dist/. sites/marketing/dist/demo/

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=orbis-marketing --branch=main
        working-directory: sites/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy Marketing Site

# Builds the Astro marketing site, the VitePress docs, AND the orb editor
# SPA, then deploys the combined bundle to Cloudflare Pages (project:
# orbis-marketing → https://orbis.protolabs.studio). The docs are served at
# /docs (built with DOCS_BASE=/docs/) and the editor at /editor (Vite
# base=/editor/) — both copied into the Astro output before deploy, so one
# Cloudflare Pages project serves all three.

on:
  push:
    branches: [main]
    paths:
      - 'sites/marketing/**'
      - 'sites/editor/**'
      - 'packages/orb-runtime/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # --- Marketing site (Astro / bun) ---
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: sites/marketing

      - name: Build marketing site
        run: bun run build
        working-directory: sites/marketing
        env:
          # The deployed license-issuer Worker URL, baked into /unlock + the
          # in-app purchase flow. A repo variable — it's just a public URL.
          PUBLIC_LICENSE_ISSUER_URL: ${{ vars.PUBLIC_LICENSE_ISSUER_URL }}

      # --- Docs (VitePress / npm) served at /docs ---
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Build docs (base /docs/)
        run: |
          npm ci
          DOCS_BASE=/docs/ npm run docs:build

      - name: Fold docs into the marketing bundle at /docs
        run: |
          rm -rf sites/marketing/dist/docs
          mkdir -p sites/marketing/dist/docs
          cp -R docs/.vitepress/dist/. sites/marketing/dist/docs/

      # --- Orb editor (Vite SPA / bun) served at /editor ---
      - name: Install editor dependencies
        run: bun install
        working-directory: sites/editor

      - name: Build orb editor (base /editor/)
        run: bun run build
        working-directory: sites/editor

      - name: Fold editor into the marketing bundle at /editor
        run: |
          rm -rf sites/marketing/dist/editor
          mkdir -p sites/marketing/dist/editor
          cp -R sites/editor/dist/. sites/marketing/dist/editor/

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name=orbis-marketing --branch=main
        working-directory: sites/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Publish Docker image to GHCR

# Rolling image build on every push to main: pushes
# `ghcr.io/protolabsai/orbis:latest` (what Watchtower polls) plus a
# pinned `sha-<short>` for rollbacks.
#
# Stable semver Docker tags (vX.Y.Z, X.Y) are cut by release.yml when
# prepare-release.yml pushes a version tag. This workflow is main-only so
# the two never step on each other.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs.yml'
      # Separate deployables, never in the app image — and release.yml's
      # changelog sync commits sites/marketing/data/changelog.json on every
      # release, which shouldn't trigger a Docker rebuild.
      - 'sites/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: protolabsai/orbis

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository == 'protoLabsAI/ORBIS'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted ubuntu runners ship with ~14 GB free. The torch
      # `+cu128` wheel pulls in cuda-toolkit, cublas, cudnn, nccl,
      # nvshmem, triton — easily 10+ GB on top of our CUDA 12.8 base
      # image. Without this step the build dies with `[Errno 28] No
      # space left on device` during the pip install layer. Reclaims
      # ~14 GB of pre-installed Android SDK / .NET / etc. we don't use.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main (2023-10-18)
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=orbis
            org.opencontainers.image.description=ORBIS — voice-first AI companion
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Verify — module import in runtime image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker run --rm \
            --entrypoint sh \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" \
            -c 'cd /app && python -c "import app, agent.tools, agent.filler, agent.delivery, agent.backchannel, voice.stt, voice.tts, a2a.server; print(\"imports ok\")"'

      - name: Summary
        run: |
          echo "## Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pull:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

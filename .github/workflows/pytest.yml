name: 'Pytest'

# Runs the native fork's backend suite on every PR and push to main.
# The [test] extra is enough for this gate; optional model/audio extras
# such as speechbrain and funasr continue to skip cleanly unless installed.
# Native-only guardrails also live here, including checks that PWA/WebRTC
# browser-client packages do not return to the Tauri-first fork.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable as a pre-release gate by release.yml + desktop-build.yml so a
  # tag never ships a red suite (#490). Single source of truth for "the
  # backend test suite" — the same job that gates PRs gates releases.
  workflow_call:
    inputs:
      ref:
        description: 'Exact commit or tag to test; defaults to the caller ref'
        required: false
        type: string

# Group includes github.workflow so that when this is reused as a release
# gate (workflow_call from release.yml AND desktop-build.yml on the SAME tag
# ref), the two callers land in DISTINCT groups — github.workflow resolves to
# the *caller's* name. Keying on github.ref alone made both callers share one
# group with cancel-in-progress, so they cancelled each other and the Release
# job was skipped (v0.2.149 incident). PR/push runs still dedupe per ref.
concurrency:
  group: pytest-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package + test extra
        run: |
          python -m pip install --upgrade pip
          # pyproject force-includes web/dist into the wheel (the SPA the
          # desktop sidecar serves). hatchling >=1.27 validates that path at
          # metadata-prep time, so an editable install fails if it is absent.
          # The Python tests don't exercise the bundled SPA, so an empty dir
          # satisfies the force-include (and app.py's StaticFiles mount)
          # without a frontend build here.
          mkdir -p web/dist
          # mlx-lm is darwin/arm64-gated in pyproject, so this is a no-op
          # on Ubuntu. Whisper remains installed in the native fork because
          # Mac desktop local STT is still the default path.
          pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q

name: Deploy License Issuer

# Deploys the ORBIS paid-unlock Worker (Stripe Checkout → mint Ed25519 license)
# to Cloudflare Workers. Secrets (STRIPE_*, LICENSE_PRIVATE_KEY, RESEND_API_KEY)
# are managed with `wrangler secret put`, NOT here. Reuses the same Cloudflare
# credentials as the marketing deploy.

on:
  push:
    branches: [main]
    paths:
      - 'sites/license-issuer/**'
      - '.github/workflows/license-issuer-deploy.yml'
  workflow_dispatch:

concurrency:
  group: license-issuer-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: npm install
        working-directory: sites/license-issuer

      - name: Deploy
        run: npx wrangler deploy
        working-directory: sites/license-issuer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

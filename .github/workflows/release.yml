name: 'Release'

# Triggered by a push of a vX.Y.Z tag (cut by prepare-release.yml).
# Builds and pushes the stable semver Docker tags and creates a GitHub
# release with filtered commit notes. Rolling `latest` is handled by
# docker-publish.yml on main pushes, not here.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: protolabsai/orbis

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'protoLabsAI/ORBIS'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Reclaim ~14 GB from the runner (pre-installed Android SDK /
      # .NET / Haskell / tool-cache we don't use). Without this the
      # torch +cu128 pip layer blows past the runner's ~14 GB default
      # free space with `[Errno 28] No space left on device`. See the
      # identical step in docker-publish.yml for the full rationale.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main (2023-10-18)
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # ── Version ───────────────────────────────────────────────────────────────

      - name: Read version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Docker ────────────────────────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is pushed on every main merge by docker-publish.yml;
          # this workflow only adds the stable semver pins.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=orbis
            org.opencontainers.image.description=ORBIS — voice-first AI companion
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # ── GitHub Release ────────────────────────────────────────────────────────
      #
      # `actions/attest-build-provenance` previously lived here but
      # requires either a public repo or GitHub Advanced Security on a
      # paid org plan. Neither applies to ORBIS today — the step just
      # logged a red 403 every release for no practical gain. Inline
      # buildkit provenance (`provenance: true` on docker/build-push
      # above) still attaches SLSA metadata to the image manifest.

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' 2>/dev/null || echo "")
          # Strip chore/docs noise lines from the auto-generated body
          FILTERED=$(echo "$NOTES" | grep -Eiv '^\* (chore|docs):' || echo "$NOTES")
          {
            echo "notes<<NOTES_EOF"
            echo "$FILTERED"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.notes }}"

      # ── Polished release notes via the shared release-tools action ──────────

      - name: Compute previous tag
        id: prev_tag
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "${PREV_TAG}" ]; then
            echo "No previous tag found — first release; will skip polished notes."
          fi

      - name: Polish release notes + post to Discord
        # Best-effort: if GATEWAY_API_KEY or DISCORD_RELEASE_WEBHOOK isn't
        # set, or the LLM call fails, the release itself still shipped above
        # — we just skip the polished announcement.
        if: steps.prev_tag.outputs.tag != ''
        continue-on-error: true
        uses: protoLabsAI/release-tools@v0.1.0
        with:
          version: ${{ steps.version.outputs.tag }}
          previous-version: ${{ steps.prev_tag.outputs.tag }}
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      # ── Failure alert ─────────────────────────────────────────────────────────

      - name: Alert on release failure
        if: failure()
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_DEV_WEBHOOK}" ]; then
            echo "DISCORD_DEV_WEBHOOK not set — can't alert."
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="ORBIS release FAILED for ${TAG}. Run: ${RUN_URL}"
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\": \"${MSG}\"}" \
            "${DISCORD_DEV_WEBHOOK}" || true

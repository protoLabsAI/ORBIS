name: 'Release'

# Triggered by a push of a vX.Y.Z tag (cut by prepare-release.yml).
# Builds and pushes the stable semver Docker tags and creates a GitHub
# release with filtered commit notes. Rolling `latest` is handled by
# docker-publish.yml on main pushes, not here.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: protolabsai/orbis

jobs:
  # Pre-release gate (#490): a tag must pass the backend suite before we
  # build/push the Docker image or cut the GitHub release. Same suite that
  # gates PRs (reusable pytest.yml).
  test:
    name: Test gate
    if: github.repository == 'protoLabsAI/ORBIS'
    uses: ./.github/workflows/pytest.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.repository == 'protoLabsAI/ORBIS'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Reclaim ~14 GB from the runner (pre-installed Android SDK /
      # .NET / Haskell / tool-cache we don't use). Without this the
      # torch +cu128 pip layer blows past the runner's ~14 GB default
      # free space with `[Errno 28] No space left on device`. See the
      # identical step in docker-publish.yml for the full rationale.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main (2023-10-18)
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # ── Version ───────────────────────────────────────────────────────────────

      - name: Read version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── SPA fast-fail ─────────────────────────────────────────────────────────
      #
      # The Dockerfile builds the SPA inside its `web` stage, but that
      # only fires after the CUDA runtime base image pulls. A broken
      # `bun run build` would otherwise eat that cost before surfacing,
      # and would shadow the real signal under a vague Docker failure.
      # The Dockerfile re-runs the build because the wheel/Docker image
      # needs `web/dist/` populated; the duplicate cost is small compared
      # with the Docker build.

      - name: Set up Bun (for SPA fast-fail)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Build SPA (fast-fail)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # ── Docker ────────────────────────────────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is pushed on every main merge by docker-publish.yml;
          # this workflow only adds the stable semver pins.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=orbis
            org.opencontainers.image.description=ORBIS — voice-first AI companion
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # ── GitHub Release ────────────────────────────────────────────────────────
      #
      # `actions/attest-build-provenance` previously lived here but
      # requires either a public repo or GitHub Advanced Security on a
      # paid org plan. Neither applies to ORBIS today — the step just
      # logged a red 403 every release for no practical gain. Inline
      # buildkit provenance (`provenance: true` on docker/build-push
      # above) still attaches SLSA metadata to the image manifest.

      # ── Release notes: one generation → GitHub release body + marketing changelog ──

      - name: Compute previous tag
        id: prev_tag
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          # The tag immediately preceding VERSION in version-sort order (not just
          # the newest other tag) — a manual rerun for an older release would
          # otherwise diff against a newer tag and invert the notes.
          PREV_TAG=$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              awk -v current="${VERSION}" '
                $0 == current { seen = 1; next }
                seen { print; exit }
              '
          )
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "${PREV_TAG}" ]; then
            echo "No predecessor tag — first release; will use GitHub auto notes."
          fi

      - name: Raw release notes (fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's auto-generated notes (PR titles), written to raw-notes.md.
          # Used only if the polished step below is skipped (first release) or
          # fails (gateway/LLM down), so a release never ships a blank body.
          TAG="${{ steps.version.outputs.tag }}"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' 2>/dev/null \
            | grep -Eiv '^\* (chore|docs):' > raw-notes.md || true

      - name: Polished release notes + Discord (release-tools)
        id: notes
        # One LLM generation drives the GitHub release body AND the marketing
        # changelog (steps below), so they can't drift. Writes the notes to
        # release-notes.md so those steps read a file, not a fragile multiline
        # output. Best-effort: if GATEWAY_API_KEY / DISCORD_RELEASE_WEBHOOK is
        # unset or the LLM fails, the release still ships on the raw fallback.
        if: steps.prev_tag.outputs.tag != ''
        continue-on-error: true
        # SHA-pinned (this action has release-channel creds + the job has
        # contents:write). 7bea42a = v2.3.0 (adds out-file + notes/highlights).
        uses: protoLabsAI/release-tools@7bea42a1b95a7107905ca72bc99680045f2f63ef # v2.3.0
        with:
          version: ${{ steps.version.outputs.tag }}
          previous-version: ${{ steps.prev_tag.outputs.tag }}
          out-file: release-notes.md
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Prefer the polished notes; fall back to GitHub's auto notes when the
          # polish step was skipped (first release) or failed. Both are files, so
          # there's no fragile multiline-output interpolation.
          if [ -s release-notes.md ]; then
            SRC=release-notes.md
            echo "Using polished release notes."
          else
            SRC=raw-notes.md
            echo "Polished notes unavailable — using GitHub auto notes."
          fi
          # Idempotent: edit in place if the release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$SRC"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$SRC"
          fi

      - name: Sync the marketing changelog
        # Build a user-facing entry from the SAME polished notes and commit it to
        # main, so sites/marketing/data/changelog.json can't drift from the GitHub
        # release body. This step only LANDS the commit — the marketing deploy is
        # kicked by desktop-build.yml *after* the DMG is uploaded (see "Trigger the
        # marketing deploy" there), so /download never advertises a .dmg link
        # before the file exists. Best-effort — a changelog hiccup must never fail
        # a shipped release. (NB: a GITHUB_TOKEN push can't trigger downstream
        # workflows anyway — recursion guard — which is the other reason the deploy
        # is dispatched explicitly rather than relied on firing from this push.)
        if: steps.notes.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -s release-notes.md ] || { echo "No polished notes — skipping changelog."; exit 0; }
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"
          # release-notes.md is untracked, so it survives the branch switch.
          git fetch origin main
          git checkout -B main origin/main
          TAG="$TAG" DATE="$(date -u +%F)" \
            DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/ORBIS-${VERSION}-aarch64-apple-darwin.dmg" \
            node scripts/changelog-entry.mjs
          if git diff --quiet -- sites/marketing/data/changelog.json; then
            echo "Changelog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/marketing/data/changelog.json
          git commit -m "chore(changelog): ${TAG}"
          git push origin HEAD:main \
            || echo "::warning::changelog push to main failed — release shipped fine; update changelog.json manually."

      - name: Alert if the Discord notes post failed
        # The post is best-effort (continue-on-error above), so without this a
        # dead webhook passes GREEN and fails SILENTLY — exactly what bit
        # v0.2.113 (a stale repo-level DISCORD_RELEASE_WEBHOOK shadowed the org
        # one → 404 Unknown Webhook, and the release looked fine). Surface it on
        # the dev channel + as a CI warning, without failing the shipped release.
        if: steps.notes.outcome == 'failure'
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::warning::Release ${TAG} shipped but the Discord notes post FAILED — check the DISCORD_RELEASE_WEBHOOK secret."
          if [ -n "${DISCORD_DEV_WEBHOOK}" ]; then
            MSG="⚠️ ORBIS ${TAG} released, but the release-notes Discord post FAILED (check the DISCORD_RELEASE_WEBHOOK secret). Run: ${RUN_URL}"
            curl -sf -H 'Content-Type: application/json' -d "{\"content\": \"${MSG}\"}" "${DISCORD_DEV_WEBHOOK}" || true
          fi

      # ── Failure alert ─────────────────────────────────────────────────────────

      - name: Alert on release failure
        if: failure()
        env:
          DISCORD_DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_DEV_WEBHOOK}" ]; then
            echo "DISCORD_DEV_WEBHOOK not set — can't alert."
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="ORBIS release FAILED for ${TAG}. Run: ${RUN_URL}"
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"content\": \"${MSG}\"}" \
            "${DISCORD_DEV_WEBHOOK}" || true

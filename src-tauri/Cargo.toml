[package]
name = "orbis-tauri"
version = "0.0.0"  # overridden by CI per-tag; stay 0.0.0 in-tree for dev
edition = "2021"
description = "ORBIS — voice-first AI companion. Tauri 2 desktop shell."
authors = ["protoLabs Studio"]
# No license set yet — the main README says "License TBD" and that
# decision predates desktop-prep. Using the SPDX "NOASSERTION" marker
# so cargo doesn't warn; revisit before any public crates.io publish
# or repo-open, whichever comes first.
license = "NOASSERTION"
repository = "https://github.com/protoLabsAI/ORBIS"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles src/mic_permission.m on macOS — see build.rs and the
# file's header comment for why we can't avoid the Obj-C shim.
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
# Sidecar spawn + stdout-line parsing lives in the shell plugin.
# Without this plugin `ShellExt::shell().sidecar(...)` isn't available.
tauri-plugin-shell = "2"
# Native dialogs for the "hardware unsupported" path (sidecar exit 2)
# and generic error surfacing.
tauri-plugin-dialog = "2"
# Rust-backed fetch — bypasses WKWebView's broken POST path on macOS
# arm64 (tauri-apps/tauri#11854, #13166, #13878). The frontend imports
# `fetch` from `@tauri-apps/plugin-http`; that call IPCs to Rust which
# uses reqwest under the hood. Allowed origins are scoped to localhost
# in capabilities/default.json.
tauri-plugin-http = "2"
url = "2"
log = "0.4"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal   = { version = "0.17", optional = true }
rubato = { version = "0.15", optional = true }
tokio  = { version = "1",   optional = true, features = ["net", "io-util", "sync", "rt"] }

# Phase 2 — Apple voice-processing IO via AVAudioEngine. Replaces the
# CPAL input path on macOS with Apple-tuned AEC + AGC + NS (per
# WWDC23-10235). Output stays on CPAL. Opt-in via the
# `voice-processing` feature flag while the integration soaks; once
# verified live the flag becomes the default for native-audio builds
# and the CPAL input path is deleted.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"
optional = true
[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
optional = true
features = ["NSError", "NSObject"]
[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3"
optional = true
features = [
  "AVAudioEngine",
  "AVAudioNode",
  "AVAudioIONode",
  "AVAudioFormat",
  "AVAudioBuffer",
  "AVAudioTime",
  "AVAudioTypes",
  "block2",
]
[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"
optional = true

[features]
# Gate all native audio code behind this feature so the default build
# is byte-for-byte identical to before. Enable with:
#   cargo build --features native-audio
# The feature is activated at runtime only when AUDIO_TRANSPORT=native
# is set in the environment — the Cargo feature controls compilation,
# the env var controls behaviour at runtime.
native-audio = ["dep:cpal", "dep:rubato", "dep:tokio"]
# Phase 2 — Apple AVAudioEngine voice-processing input (AEC + AGC + NS).
# Implies native-audio. Off by default while soaking; enable with:
#   cargo tauri build --features native-audio,voice-processing
# Once verified live this becomes the default and the CPAL input path
# is deleted.
voice-processing = [
  "native-audio",
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-avf-audio",
  "dep:block2",
]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

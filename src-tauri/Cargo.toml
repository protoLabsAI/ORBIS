[package]
name = "orbis-tauri"
version = "0.0.0"  # overridden by CI per-tag; stay 0.0.0 in-tree for dev
edition = "2021"
description = "ORBIS — voice-first AI companion. Tauri 2 desktop shell."
authors = ["protoLabs Studio"]
# No license set yet — the main README says "License TBD" and that
# decision predates desktop-prep. Using the SPDX "NOASSERTION" marker
# so cargo doesn't warn; revisit before any public crates.io publish
# or repo-open, whichever comes first.
license = "NOASSERTION"
repository = "https://github.com/protoLabsAI/ORBIS"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles src/mic_permission.m on macOS — see build.rs and the
# file's header comment for why we can't avoid the Obj-C shim.
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
# Sidecar spawn + stdout-line parsing lives in the shell plugin.
# Without this plugin `ShellExt::shell().sidecar(...)` isn't available.
tauri-plugin-shell = "2"
# Native dialogs for the "hardware unsupported" path (sidecar exit 2)
# and generic error surfacing.
tauri-plugin-dialog = "2"
# Rust-backed fetch — bypasses WKWebView's broken POST path on macOS
# arm64 (tauri-apps/tauri#11854, #13166, #13878). The frontend imports
# `fetch` from `@tauri-apps/plugin-http`; that call IPCs to Rust which
# uses reqwest under the hood. Allowed origins are scoped to localhost
# in capabilities/default.json.
tauri-plugin-http = "2"
# Rust HTTP client for the IPC API proxy + SSE bridge. macOS Tahoe's
# WKWebView can't reliably stream/read HTTP bodies, so all sidecar
# traffic is routed through `api_request` / `bridge_sse` over reqwest
# instead of the webview's fetch + EventSource.
reqwest = "0.12"
url = "2"
log = "0.4"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal   = { version = "0.17", optional = true }
rubato = { version = "0.15", optional = true }
tokio  = { version = "1", features = ["net", "io-util", "sync", "rt", "time"] }

# Apple voice-processing IO via AVAudioEngine. Replaces the CPAL input
# path on macOS with Apple-tuned AEC + AGC + NS (per WWDC23-10235).
# Output stays on CPAL. Production macOS builds enable this through the
# `voice-processing` feature flag.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"
optional = true
[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
optional = true
features = ["NSError", "NSObject"]
[target.'cfg(target_os = "macos")'.dependencies.objc2-avf-audio]
version = "0.3"
optional = true
features = [
  "AVAudioEngine",
  "AVAudioNode",
  "AVAudioIONode",
  "AVAudioFormat",
  "AVAudioBuffer",
  "AVAudioTime",
  "AVAudioTypes",
  "block2",
]
[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"
optional = true

[features]
# Gate all native audio code behind this feature. Production macOS
# builds enable this together with `voice-processing`; once compiled,
# native audio is the desktop app's required transport.
native-audio = ["dep:cpal", "dep:rubato"]
# Apple AVAudioEngine voice-processing input (AEC + AGC + NS). Implies
# native-audio and is required for production macOS desktop builds:
#   cargo tauri build --features native-audio,voice-processing
voice-processing = [
  "native-audio",
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-avf-audio",
  "dep:block2",
]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
